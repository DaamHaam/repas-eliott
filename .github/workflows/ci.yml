name: Vérifier le repas Eliott
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repas-eliott
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: repas-eliott/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run build
      - run: npx tsc --noEmit -p convex/tsconfig.json
